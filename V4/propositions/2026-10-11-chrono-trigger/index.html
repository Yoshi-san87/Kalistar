<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalistar x Chrono Trigger</title>
<style>
@font-face{font-family:Cinzel;src:url('../../site/assets/fonts/cinzel-v26-latin.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:#101918;color:#e8e9e2;font:16px/1.55 Georgia,serif;letter-spacing:0}
header{padding:28px;border-bottom:1px solid #5d6b65;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:500 26px/1.3 Cinzel,serif;margin:0;color:#ead6b4}
header p{margin:0;color:#b0c3ba;font-size:14px}
main{max-width:2000px;margin:auto;padding:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 24px}
figure{margin:0;min-width:0}
figure a{display:block;aspect-ratio:4/5;background:#0b100f}
img{width:100%;height:100%;object-fit:contain;display:block}
figcaption{padding-top:12px;border-top:1px solid #465c56;margin-top:12px}
h2{font:500 19px/1.4 Cinzel,serif;margin:0;color:#f0dbb7}
figcaption p{margin:4px 0 0;color:#b3c6bd;font-size:15px}
a:focus-visible{outline:2px solid #d2b781;outline-offset:4px}
footer{padding:24px 28px;border-top:1px solid #465c56;color:#a8bab3;font-size:13px}
footer a{color:#cfba95}a{overflow-wrap:anywhere}
@media(min-width:1900px){main{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){header{padding:20px 16px;gap:8px}h1{font-size:23px}main{grid-template-columns:1fr;padding:18px 12px;gap:30px}footer{padding:20px 16px}}
</style>
</head>
<body>
<header><h1>Kalistar x Chrono Trigger</h1><p>7 illustrations &middot; Propositions</p></header>
<main>
<figure id="crono"><a href="images/crono-v3.png" target="_blank" rel="noopener" aria-label="Crono"><img src="images/crono-v3.png" alt="Crono avance sur des marches humides, son katana parcouru de fines étincelles." width="1122" height="1402"></a><figcaption><h2>Crono</h2><p>Le pas qui défie le temps</p></figcaption></figure>
<figure id="marle"><a href="images/marle-v2.png" target="_blank" rel="noopener" aria-label="Marle"><img src="images/marle-v2.png" alt="Marle tient son arbalète en garde dans une clairière froide, le visage attentif." width="1122" height="1402"></a><figcaption><h2>Marle</h2><p>Le courage derrière le sourire</p></figcaption></figure>
<figure id="lucca"><a href="images/lucca-v2.png" target="_blank" rel="noopener" aria-label="Lucca"><img src="images/lucca-v2.png" alt="Lucca rallume un petit module, agenouillée près d’une machine abandonnée." width="1122" height="1402"></a><figcaption><h2>Lucca</h2><p>Il reste une étincelle</p></figcaption></figure>
<figure id="frog"><a href="images/frog.png" target="_blank" rel="noopener" aria-label="Frog"><img src="images/frog.png" alt="Frog fait une pause au seuil d’une arche, la Masamune abaissée et une main sur le cœur." width="1122" height="1402"></a><figcaption><h2>Frog</h2><p>Le poids du serment</p></figcaption></figure>
<figure id="robo"><a href="images/robo.png" target="_blank" rel="noopener" aria-label="Robo"><img src="images/robo.png" alt="Robo s’agenouille avec précaution près d’une jeune pousse dans un ancien jardin." width="1122" height="1402"></a><figcaption><h2>Robo</h2><p>Ce que ses mains peuvent sauver</p></figcaption></figure>
<figure id="ayla"><a href="images/ayla.png" target="_blank" rel="noopener" aria-label="Ayla"><img src="images/ayla.png" alt="Ayla prend une garde solide sur un plateau dégagé, prête à protéger les siens à mains nues." width="1122" height="1402"></a><figcaption><h2>Ayla</h2><p>Personne ne passe derrière elle</p></figcaption></figure>
<figure id="magus"><a href="images/magus.png" target="_blank" rel="noopener" aria-label="Magus"><img src="images/magus.png" alt="Magus veille au bord d’une falaise, sa faux droite à la main et une faible lueur violette entre les doigts." width="1122" height="1402"></a><figcaption><h2>Magus</h2><p>Une colère qui ne s’éteint pas</p></figcaption></figure>
</main>
<footer><a href="final-prompts.json">Sources et prompts</a> &middot; <a href="https://an.sqexm.net/sp/site/Page/sqmk/Chrono/other_characters" target="_blank" rel="noopener">Personnages : Square Enix</a></footer>
</body>
</html>

<script>
const normalise = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const search=document.querySelector('#search'),faction=document.querySelector('#faction'),figures=[...document.querySelectorAll('figure')];
function filter(){let count=0;const term=normalise(search.value.trim());for(const figure of figures){figure.hidden=!(normalise(figure.textContent).includes(term)&&(!faction.value||figure.dataset.faction===faction.value));if(!figure.hidden)count++;}document.querySelector('#count').textContent=count+' illustration'+(count>1?'s':'');document.querySelector('.empty').hidden=count>0;}
search.addEventListener('input',filter);faction.addEventListener('change',filter);
</script>

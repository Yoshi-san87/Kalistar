<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalistar - Les loups blancs de Grivka</title>
<style>
@font-face{font-family:Cinzel;src:url('../../site/assets/fonts/cinzel-v26-latin.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:#101715;color:#e9ece7;font:16px/1.5 Georgia,serif;letter-spacing:0}
header{padding:25px 28px 20px;border-bottom:1px solid #4b6056;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font:500 26px/1.3 Cinzel,Georgia,serif;color:#e7d4b6}
header p{margin:0;font-size:14px;color:#aebdb4}
main{max-width:2400px;margin:auto;padding:26px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 22px}
figure{margin:0;min-width:0}
.artwork{display:block;aspect-ratio:2/3;background:#080d0b}
img{display:block;width:100%;height:100%;object-fit:contain}
figcaption{border-top:1px solid #4b6056;margin-top:12px;padding-top:12px}
h2{margin:0;color:#ecd8b8;font:500 20px/1.4 Cinzel,Georgia,serif}
.role{margin:3px 0 8px;color:#a9cbd1;font-size:15px}
.weapon{margin:0 0 5px;color:#e4e7df;font-size:16px;font-style:italic}
.note{margin:0;color:#b8c6bb;font-size:14px}
a{color:#afdae3;text-underline-offset:3px}
a:focus-visible{outline:2px solid #bdeaff;outline-offset:4px}
footer{border-top:1px solid #4b6056;padding:20px 28px;color:#b4bdb2;font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
@media(min-width:1750px){main{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:1100px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){header{padding:20px 16px}h1{font-size:23px}main{grid-template-columns:1fr;padding:20px 12px;gap:30px}footer{padding:20px 16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<footer><span>Illustrations uniquement &middot; Noms provisoires</span><a href="README.md">Dossier artistique</a><a href="provenance.json">Sources et prompts</a></footer>

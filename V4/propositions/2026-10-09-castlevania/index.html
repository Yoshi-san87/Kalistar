<header><h1>Kalistar x Castlevania</h1><p>8 personnages &middot; Dracula Feu et Sang</p></header><main>
<figure id="trevor-belmont"><a href="images/trevor-belmont-v2.png" target="_blank" rel="noopener" aria-label="Trevor Belmont"><img src="images/trevor-belmont-v2.png" alt="Trevor Belmont : Trevor Belmont from Castlevania, adult weathered vampire hunter, tousled dark brown hair and short stubble, unmistakable tired defiance in his eyes. Worn ivory-white high-collared belted coat with dark leather reinforcement, brown shoulder straps, muted red lining, black trousers and practical tall boots. In a low three-quarter advancing pivot after a whip strike, left foot forward and weight grounded, coat flaring. One hand visibly grips the handle of his long chain whip; the chain follows ONE clean natural sweeping curve from the hand through open space toward the frame edge, no disconnected floating links, other hand relaxed near his belt for balance. His jaw clenches, a small grim almost-amused expression amid exhaustion. A damp narrow stone bridge with one broken parapet against broad blue-grey dusk; no distant city. Warm torch reflection catches ivory fabric, brass fittings and his cheek; sparse rain. The action feels resourceful and stubborn, not a superhero landing." width="1122" height="1402"></a><figcaption><h2>Trevor Belmont</h2><p>Le dernier pas avant l'impact</p></figcaption></figure>
<figure id="alucard"><a href="images/alucard-v2.png" target="_blank" rel="noopener" aria-label="Alucard"><img src="images/alucard-v2.png" alt="Alucard : Alucard from Castlevania, adult pale androgynously beautiful aristocratic swordsman with long flowing pale blond hair, luminous amber eyes and fine serious facial structure. Long charcoal-black fitted coat with worn gold embroidery, white shirt partly visible, high boots and refined vambraces. Caught in a graceful lateral sword parry on a deserted terrace, upper body turned three-quarter toward the viewer, feet planted in a fencing stance, expression mournfully resolved. One hand grips a fine straight silver sword with ornate gold guard, sword angled from his hip across the lower open space, rigid blade and hilt perfectly aligned; the other open hand balances behind him. His coat and hair follow one consistent breeze. Background only a pale moonlit mist plane and the silhouette of a single tall broken arch. A warm gold edge on his hair against desaturated teal stone, face clearly lit; elegiac nobility, not smiling, no oversize armour." width="1122" height="1402"></a><figcaption><h2>Alucard</h2><p>Ce qu'il reste a proteger</p></figcaption></figure>
<figure id="simon-belmont"><a href="images/simon-belmont.png" target="_blank" rel="noopener" aria-label="Simon Belmont"><img src="images/simon-belmont.png" alt="Simon Belmont : Simon Belmont from classic Castlevania, adult broad-shouldered muscular red-auburn-haired hunter with a simple red headband, rugged strong face and a blunt courageous glare. Distinct from Trevor: bronze-brown sleeveless leather combat cuirass and layered short war tunic with a restrained fur shoulder piece, metal wrist guards, dark fitted underlayers and sturdy tall boots. Frontal three-quarter full-body stance on a broad stone step, shoulders square, one boot raised on a low block. He draws the Vampire Killer whip taut between his hands at waist height before confronting something offscreen: clearly visible continuous braided whip, normal forearm lengths, correct fingers and convincing tension. Determination and old fatigue, not a bodybuilder photo. Quiet ancient gate passage behind him, a single massive stone door and cool mist, no busy architecture. Low amber side light on weathered copper and reddish hair, sober steel-blue shadows. Heroic physical solidity with rich brushwork." width="1122" height="1402"></a><figcaption><h2>Simon Belmont</h2><p>La force d'une promesse</p></figcaption></figure>
<figure id="carmilla"><a href="images/carmilla.png" target="_blank" rel="noopener" aria-label="Carmilla"><img src="images/carmilla.png" alt="Carmilla : Carmilla from Castlevania, adult tall pale vampire noblewoman, long immaculate white hair swept back, red eyes, severe beautiful face with a knowing icy sneer. Recognizable deep crimson and burgundy high-collared long dress adapted as practical layered battle attire, tailored leather waist and dark metallic shoulder accents, no excessive exposed skin. She has just risen from a throne and steps sideways into readiness, body in elegant profile while turning her face toward the viewer. One hand holds a long straight narrow sword low beside her leg, perfectly aligned blade and guard, the other hand rests lightly on the empty throne arm. A believable controlled moment of dangerous impatience, not a mannequin pose. Background almost empty: one dark throne silhouette at the edge and broad shadowed stone wall, no windows or chandeliers clutter. Single cool sidelight on white hair and pale face, low warm red reflection on weathered fabric, restrained crimson, bone and black palette. No blood bath." width="1122" height="1402"></a><figcaption><h2>Carmilla</h2><p>Le prix de la couronne</p></figcaption></figure>
<figure id="isaac"><a href="images/isaac.png" target="_blank" rel="noopener" aria-label="Isaac"><img src="images/isaac.png" alt="Isaac : Isaac, the adult Black human Forgemaster from the original Castlevania animated series, shaved head, calm severe brown eyes, lean composed physique, subtle facial markings, layered dark burgundy and charcoal travelling robes with a high fitted collar and red sash, practical boots. Seated forward on a low plain stone block, elbows naturally free, he studies a small engraved forging dagger held point-down safely in one hand; the other hand opens palm-up to a tiny restrained blue-white ember. His expression carries thoughtfulness and hard-earned self-control rather than rage. Full or near-full seated silhouette, natural proportions and hands, readable close enough to see his face while giving legs space. Quiet abandoned courtyard suggested ONLY by one low wall and pale overcast sky, no army or secondary creatures. Dusty wine-red cloth and dark warm skin set against subdued turquoise-grey light, dagger catches a small silver gleam; painterly, humane and intense." width="1122" height="1402"></a><figcaption><h2>Isaac</h2><p>Choisir ce que l'on devient</p></figcaption></figure>
<figure id="hector"><a href="images/hector.png" target="_blank" rel="noopener" aria-label="Hector"><img src="images/hector.png" alt="Hector : Hector from the original Castlevania animated series, adult pale human Forgemaster with medium-long silver-grey hair and thoughtful clear blue eyes, youthful handsome but worn face. Faded blue-grey shirt, dark fitted vest, practical leather belt and smithing bracer, unglamorous worn working clothes. Three-quarter standing pose at the corner of a plain old anvil, shoulders slightly stooped with concentration, one hand grips his short forging hammer normally while its head rests on the anvil; his other bare hand hovers above a small luminous blue rune etched into a simple metal fragment. No creature or corpse. There is tenderness and apprehension in his expression, a maker uncertain of what his skill will become. Character visible down to boots, hammer shaft straight, hands coherent, natural elbow lengths. Background is one broad soot-dark wall and a tall slit of daylight; no racks of tools or laboratory clutter. Subtle cold cobalt magical reflection and a warm copper rim from a low forge outside frame, tactile brushed cloth and soot." width="1122" height="1402"></a><figcaption><h2>Hector</h2><p>La main qui peut encore creer</p></figcaption></figure>
<figure id="dracula"><a href="images/dracula.png" target="_blank" rel="noopener" aria-label="Dracula"><img src="images/dracula.png" alt="Dracula : Dracula, Vlad Dracula Tepes from Castlevania, adult imposing ancient vampire lord, long swept-back black hair, pointed dark beard and moustache, pale angular face, red eyes showing unbearable grief beneath fury. Rich black and oxblood long noble coat, high crimson-lined cape collar, dark bronze clasps and restrained antique armour details. Standing almost motionless in three-quarter view with one hand open before his chest, holding a SMALL dense red-orange flame; the other hand grips the arm of an empty plain chair at his side as though a memory anchors him. Full silhouette, cape hanging heavily rather than giant wings, powerful natural anatomy, face is the emotional focal point. No snarling monster mouth, no exaggerated fangs, no victim. Simple ruined chamber indicated by one tall window opening onto a broad storm-grey sky, no crowded gothic skyline. Motivated amber firelight across his face and knuckles opposed to cold blue window light. Severe, tragic, frightening, rich painted texture." width="1122" height="1402"></a><figcaption><h2>Dracula</h2><p>Le silence apres la colere</p></figcaption></figure>
<figure id="sypha"><a href="images/sypha.png" target="_blank" rel="noopener" aria-label="Sypha Belnades"><img src="images/sypha.png" alt="Sypha Belnades : Sypha Belnades from Castlevania, adult young woman with short copper-red hair and intelligent expressive blue eyes, recognizable generous blue Speaker robes with lighter blue cloak, tan belt and practical boots. Dynamic grounded lateral spellcasting stance, body turning at the waist and cloak following the movement. One hand extended in a clear deliberate finger gesture releases a compact curved ribbon of orange fire toward an offscreen threat; the other lowered open hand forms a small translucent pale blue ice crescent, hands separated and unmistakable, not giant magic circles. Her face shows fierce concern and lively resolve as though protecting someone just outside the image. Keep the spell modest and the face visible, natural limbs, stance from head to feet with generous room around arms. Quiet low stone threshold and broad rain-washed pale sky, no armies or architecture clutter. Cobalt fabric, warm rust hair, localized fire gold and frosty aqua contrasted against muted stone, matching Kalistar painterly colour planes. No staff, no added weapons." width="1122" height="1402"></a><figcaption><h2>Sypha Belnades</h2><p>Une etincelle contre la nuit</p></figcaption></figure>
<figure id="dracula-sang"><a href="images/dracula-sang.png" target="_blank" rel="noopener" aria-label="Dracula, version Sang"><img src="images/dracula-sang.png" alt="Dracula en plein assaut sur les marches, son manteau emporte par le mouvement et une energie de sang dans la main." width="1122" height="1402"></a><figcaption><h2>Dracula &middot; Sang</h2><p>Quand le deuil devient faim</p></figcaption></figure>

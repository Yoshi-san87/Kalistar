<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalistar | Batman : illustrations</title>
  <style>
    @font-face{font-family:Cinzel;src:url("../../site/assets/fonts/cinzel-v26-latin.woff2") format("woff2");font-display:swap}
    *{box-sizing:border-box}
    html{color-scheme:dark}
    body{margin:0;background:#101614;color:#eeeae2;font:15px/1.5 system-ui,sans-serif;letter-spacing:0}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 32px;border-bottom:1px solid #586253}
    .brand{margin:0 0 6px;color:#bda17f;font-size:12px}
    h1{margin:0;font:600 28px/1.3 Cinzel,Georgia,serif}
    .count{margin:0;color:#b8c6c1;font-size:13px}
    main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 24px;padding:28px 32px 40px}
    figure{margin:0;min-width:0}
    .art{display:block;aspect-ratio:1122/1402;background:#070b0a}
    img{display:block;width:100%;height:100%;object-fit:contain}
    figcaption{padding-top:12px}
    h2{margin:0;font:600 20px/1.4 Cinzel,Georgia,serif;overflow-wrap:anywhere}
    h2 span{display:inline-block;margin-right:12px;color:#bf9e71;font:12px/1.4 system-ui,sans-serif}
    figcaption p{margin:5px 0 0;color:#c8d0c9;font:italic 16px/1.5 Georgia,serif}
    small{display:block;margin-top:7px;color:#dcba8e;font-size:12px}
    aside{padding:24px 32px;border-top:1px solid #586253}
    aside h2{font-size:18px}
    aside p{max-width:900px;margin:8px 0;color:#bec7c1;overflow-wrap:anywhere}
    footer{padding:18px 32px;border-top:1px solid #313e37}
    footer a{display:inline-flex;align-items:center;min-height:44px;color:#b8d9ce;font-size:13px}
    a:focus-visible{outline:3px solid #d4ba8c;outline-offset:4px}
    @media(min-width:1900px){main{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 18px;padding:24px}header,aside,footer{padding-left:24px;padding-right:24px}}
    @media(max-width:600px){header{align-items:flex-start;flex-direction:column;gap:10px;padding:20px 16px}h1{font-size:24px}main{grid-template-columns:minmax(0,1fr);padding:18px 16px 28px;gap:28px}aside,footer{padding:20px 16px}h2{font-size:20px}}
  </style>
</head>
<body>

  <main aria-label="Illustrations disponibles">

  </main>

    <p>Joker, Harley Quinn, Bane et Robin : demandes refus&eacute;es par le g&eacute;n&eacute;rateur.</p>

  <footer><a href="manifest.json" target="_blank" rel="noopener">Premi&egrave;re passe</a> &middot; <a href="attempts-02.json" target="_blank" rel="noopener">Deuxi&egrave;me passe : prompts et provenance</a></footer>
</body>
</html>

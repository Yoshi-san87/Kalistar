nd-assault-outfit","status":"illustration-a-valider"},{"key":"lara-last-revelation","name":"Lara Croft","episode":"The Last Revelation (1999)","scene":"Égypte. La découverte d'une relique laisse place au doute face à l'ancien avertissement.","desc":"Égypte. La découverte d'une relique laisse place au doute face à l'ancien avertissement.","detail":"TOMB RAIDER IV THE LAST REVELATION, EGYPT. ADULT Lara (NOT her childhood prologue) in turquoise sleeveless opaque fitted top, brown practical shorts, brown backpack, fingerless gloves, twin holstered pistols, brown calf boots and long chestnut braid. Waist-to-boot including full head and upper legs, slightly pulled-back seated/reaching composition: she kneels in three-quarter view LEFT at a low single Egyptian stone altar; torso upright, one arm raises a warm red flare to shoulder height, OTHER hand holds a small ankh-like gold amulet just above altar, delicately by its sturdy top loop. Her eyes study the object with genuine concern and moral doubt, lips pressed and eyebrows slightly furrowed. Hands anatomically readable, five fingers and no extra arms. No gigantic weapons, no skulls or gore, no garment blowing without wind. One broad weathered sandstone wall and ONE large stylized ancient relief behind her, faint turquoise reflected pool-light below, flare amber-red bouncing from amulet onto face, very few tiny sparks. No thousands of hieroglyphs, no pyramid panorama, no crowded treasure pile. Quiet ominous chamber, attention on Lara and the decision, same painterly Kalistar grain and restrained accents as references.","source":"https://www.tombraider.com/news/video-games/andy-sandham-and-richard-morton-talk-laras-characterization-in-the-last","number":4,"title":"Le poids du sceau","group":"The Last Revelation (1999)","costume":"Tenue classique et longue tresse, éclairées par la fusée rouge.","weapon":"Pistolets rangés ; relique et fusée éclairante en main.","crystal":"The Last Revelation (1999)","file":"images/04-lara-la

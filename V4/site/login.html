<!doctype html>
<html lang="fr" data-hosting="static">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101413">
  <meta name="referrer" content="same-origin">
  <title>Kalistar - Connexion</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="login-intro.css">
  <link rel="preload" href="assets/fonts/cinzel-v26-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script defer src="assets/lucide.min.js"></script>
  <script defer src="cloud-config.js"></script>
  <script defer src="cloud-session.js"></script>
  <script defer src="login-intro.js"></script>
  <script defer src="login.js"></script>
</head>
<body>
  <picture class="login-world" aria-hidden="true"><source media="(max-width:699px)" srcset="assets/home/sanctum-phone-v1.webp"><img src="assets/home/sanctum-v1.webp" alt="" width="1672" height="941"></picture>
  <main class="login-main">
    <img class="login-brand" src="assets/logo-rainbow-v2.webp" alt="Kalistar Card Game" width="300" height="100">
    <div class="login-seal" aria-hidden="true"><img src="assets/navigation/kalistel-rainbow-v2.webp" alt="" width="52" height="72"></div>
    <section class="login-entry" aria-labelledby="login-title">
      <p class="login-eyebrow">Acc&egrave;s priv&eacute;</p>
      <h1 id="login-title">Connexion</h1>
      <form id="login-form">
        <label>Adresse email<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
        <label>Mot de passe<span class="password-field"><input name="password" id="login-password" type="password" autocomplete="current-password" maxlength="1024" required><button type="button" data-login-action="reveal" aria-label="Afficher le mot de passe" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button></span></label>
        <button class="login-submit" type="submit"><i data-lucide="log-in" aria-hidden="true"></i><span>Se connecter</span></button>
      </form>
      <button class="login-forgot" type="button" data-login-action="forgot">Mot de passe oubli&eacute; ?</button>
      <p id="login-status" role="status" aria-live="polite"></p>
      <p id="login-error" role="alert"></p>
    </section>
  </main>
</body>
</html>

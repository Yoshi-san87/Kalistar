<body><header><img src="flag.png" width="109" height="230" alt="Banniere Octopath"><div><p>KALISTAR · COLLABORATION NON OFFICIELLE</p><h1>Octopath Traveler I &amp; II</h1><nav aria-label="Livres"><a href="#book-1">Traveler I</a><a href="#book-2">Traveler II</a></nav></div></header>
<main><section id="book-1"><h2>Traveler I</h2><div class="cards"><figure id="ophilia"><a class="card" href="cards/ophilia/card.png" aria-label="OPHILIA : LA FLAMME DANS LA NEIGE"><img src="cards/ophilia/card.png" width="897" height="1497" alt="OPHILIA, LA FLAMME DANS LA NEIGE, PRÊTRESSE, positions 4 et 5"></a><figcaption><h3>OPHILIA</h3><p class="title">LA FLAMME DANS LA NEIGE</p><p class="identity">LUXO · Sceptre · P4 / P5</p><p>Soutien lumineux : coeur préventif et potion, peu d&#39;attaque physique. La foi protège les vivants ; aucune résurrection de cimetière.</p><nav aria-label="Fichiers OPHILIA"><a href="../../propositions/2026-10-20-octopath-traveler/images/01-ophilia-02.png">Illustration</a><a href="cards/ophilia/card.psd">PSD natif</a></nav></figcaption></figure><figure id="cyrus"><a class="card" href="cards/cyrus/card.png" aria-label="CYRUS : LA PAGE MANQUANTE"><img src="cards/cyrus/card.png" width="897" height="1497" alt="CYRUS, LA PAGE MANQUANTE, ÉRUDIT, positions 3 et 4"></a><figcaption><h3>CYRUS</h3><p class="title">LA PAGE MANQUANTE</p><p class="identity">CRYO · Tome · P3 / P4</p><p>Érudit offensif de glace, quatre faces magiques et une potion pour transmettre son savoir ; défense faible, une relance.</p><nav aria-label="Fichiers CYRUS"><a href="../../propositions/2026-10-20-octopath-traveler/images/02-cyrus-01.png">Illustration</a><a href="cards/cyrus/card.psd">PSD natif</a></nav></figcaption></figure><figure id="tressa"><a class="card" href="cards/tressa/card.png" aria-label="TRESSA : L&#39;HORIZON VAUT LE DÉTOUR"><img src="cards/tressa/card.png" width="897" height="1497" alt="TRESSA, L&#39;HORIZON VAUT LE DÉTOUR, MARCHANDE, positions 3 et 5"></a><figcaption><h3>TRESSA</h3><p class="title">L&#39;HORIZON VAUT LE DÉTOUR</p><p class="identity">AERO · Lance · P3 / P5</p><p>Marchande polyvalente : trèfle pour la bonne occasion, potion partagée et esquive. Le vent soutient le voyage, sans effet économique inventé.</p><nav aria-label="Fichiers TRESSA"><a href="../../propositions/2026-10-20-octopath-traveler/images/03-tressa-03.png">Illustration</a><a href="cards/tressa/card.psd">PSD natif</a></nav></figcaption></figure><figure id="olberic"><a class="card" href="cards/olberic/card.png" aria-label="OLBERIC : TENIR LE PASSAGE"><img src="cards/olberic/card.png" width="897" height="1497" alt="OLBERIC, TENIR LE PASSAGE, GUERRIER, positions 1 et 2"></a><figcaption><h3>OLBERIC</h3><p class="title">TENIR LE PASSAGE</p><p class="identity">MINERO · Epée longue · P1 / P2</p><p>Tank de roche : chiffres DEF réguliers et Garde D3, sans esquive ni Mort. Sa protection a pour prix une attaque modérée.</p><nav aria-label="Fichiers OLBERIC"><a href="../../propositions/2026-10-20-octopath-traveler/images/04-olberic-01.png">Illustration</a><a href="cards/olberic/card.psd">PSD natif</a></nav></figcaption></figure><figure id="primrose"><a class="card" href="cards/primrose/card.png" aria-label="PRIMROSE : DERRIÈRE LE SOURIRE"><img src="cards/primrose/card.png" width="897" height="1497" alt="PRIMROSE, DERRIÈRE LE SOURIRE, DANSEUSE, positions 3 et 5"></a><figcaption><h3>PRIMROSE</h3><p class="title">DERRIÈRE LE SOURIRE</p><p class="identity">NECRO · Dague · P3 / P5</p><p>Danse de soutien : puissance physique D5 et potion D2, une esquive. L&#39;ombre et la dague restent secondaires ; pas de coeur réservé aux soigneurs.</p><nav aria-label="Fichiers PRIMROSE"><a href="../../propositions/2026-10-20-octopath-traveler/images/05-primrose-01.png">Illustration</a><a href="cards/primrose/card.psd">PSD natif</a></nav></figcaption></figure><figure id="alfyn"><a class="card" href="cards/alfyn/card.png" aria-label="ALFYN : LE REMÈDE AVANT LA ROUTE"><img src="cards/alfyn/card.png" width="897" height="1497" alt="ALFYN, LE REMÈDE AVANT LA ROUTE, APOTHICAIRE, positions 3 et 5"></a><figcaption><h3>ALFYN</h3><p class="title">LE REMÈDE AVANT LA ROUTE</p><p class="identity">CRYO · Hache · P3 / P5</p><p>Apothicaire de glace : coeur D4 et potion D3, défense solide pour un soutien, une relance. La hache demeure une arme de secours.</p><nav aria-label="Fichiers ALFYN"><a href="../../propositions/2026-10-20-octopath-traveler/images/06-alfyn-01.png">Illustration</a><a href="cards/alfyn/card.psd">PSD natif</a></nav></figcaption></figure><figure id="therion"><a class="card" href="cards/therion/card.png" aria-label="THERION : UNE DETTE AU POIGNET"><img src="cards/therion/card.png" width="897" height="1497" alt="THERION, UNE DETTE AU POIGNET, VOLEUR, positions 2 et 3"></a><figcaption><h3>THERION</h3><p class="title">UNE DETTE AU POIGNET</p><p class="identity">PYRO · Dague · P2 / P3</p><p>Voleur physique, feu ponctuel, trèfle D2 et esquive D4. Pas de vol d&#39;inventaire ni nouvelle règle de richesse.</p><nav aria-label="Fichiers THERION"><a href="../../propositions/2026-10-20-octopath-traveler/images/07-therion-01.png">Illustration</a><a href="cards/therion/card.psd">PSD natif</a></nav></figcaption></figure><figure id="haanit"><a class="card" href="cards/haanit/card.png" aria-label="H&#39;AANIT : À L&#39;ÉCOUTE DES BOIS"><img src="cards/haanit/card.png" width="897" height="1497" alt="H&#39;AANIT, À L&#39;ÉCOUTE DES BOIS, CHASSERESSE, positions 2 et 4"></a><figcaption><h3>H&#39;AANIT</h3><p class="title">À L&#39;ÉCOUTE DES BOIS</p><p class="identity">ELECTRO · Arc · P2 / P4</p><p>Chasseuse à distance surtout physique ; un éclair, une puissance physique partagée et une relance DEF. Linde est narrative, sans seconde unité.</p><nav aria-label="Fichiers H&#39;AANIT"><a href="../../propositions/2026-10-20-octopath-traveler/images/08-haanit-03.png">Illustration</a><a href="cards/haanit/card.psd">PSD natif</a></nav></figcaption></figure></div></section><section id="book-2"><h2>Traveler II</h2><div class="cards"><figure id="hikari"><a class="card" href="cards/hikari/card.png" aria-label="HIKARI : LE SABRE RETENU"><img src="cards/hikari/card.png" width="897" height="1497" alt="HIKARI, LE SABRE RETENU, GUERRIER, positions 1 et 2"></a><figcaption><h3>HIKARI</h3><p class="title">LE SABRE RETENU</p><p class="identity">LUXO · Katana · P1 / P2</p><p>DPS au katana : pic physique, puissance D2 et esquive D1. Lumière pour son idéal de paix, aucun pouvoir garanti ni double attaque.</p><nav aria-label="Fichiers HIKARI"><a href="../../propositions/2026-10-20-octopath-traveler/images/09-hikari-05.png">Illustration</a><a href="cards/hikari/card.psd">PSD natif</a></nav></figcaption></figure><figure id="agnea"><a class="card" href="cards/agnea/card.png" aria-label="AGNEA : LE PREMIER RANG"><img src="cards/agnea/card.png" width="897" height="1497" alt="AGNEA, LE PREMIER RANG, DANSEUSE, positions 3 et 5"></a><figcaption><h3>AGNEA</h3><p class="title">LE PREMIER RANG</p><p class="identity">AERO · Dague · P3 / P5</p><p>Danseuse Aéro : puissance D5 et trèfle D3 pour entraîner ses alliés, esquive D2. Distincte de Primrose, sans potion ni soins inventés.</p><nav aria-label="Fichiers AGNEA"><a href="../../propositions/2026-10-20-octopath-traveler/images/10-agnea-02.png">Illustration</a><a href="cards/agnea/card.psd">PSD natif</a></nav></figcaption></figure><figure id="partitio"><a class="card" href="cards/partitio/card.png" aria-label="PARTITIO : UNE AFFAIRE POUR TOUS"><img src="cards/partitio/card.png" width="897" height="1497" alt="PARTITIO, UNE AFFAIRE POUR TOUS, MARCHAND, positions 1 et 3 et 5"></a><figcaption><h3>PARTITIO</h3><p class="title">UNE AFFAIRE POUR TOUS</p><p class="identity">PYRO · Lance · P1 / P3 / P5</p><p>Marchand résilient : puissance D4, trèfle D2 et DEF sans face d&#39;esquive. Feu de son métier conservé, aucune monnaie ajoutée au combat.</p><nav aria-label="Fichiers PARTITIO"><a href="../../propositions/2026-10-20-octopath-traveler/images/11-partitio-01.png">Illustration</a><a href="cards/partitio/card.psd">PSD natif</a></nav></figcaption></figure><figure id="osvald"><a class="card" href="cards/osvald/card.png" aria-label="OSVALD : LE FEU SOUS LA CENDRE"><img src="cards/osvald/card.png" width="897" height="1497" alt="OSVALD, LE FEU SOUS LA CENDRE, ÉRUDIT, positions 4"></a><figcaption><h3>OSVALD</h3><p class="title">LE FEU SOUS LA CENDRE</p><p class="identity">PYRO · Tome · P4</p><p>Érudit de feu très offensif, cinq attaques magiques, potion D1 mais aucune esquive ni relance ; fragilité numérique assumée.</p><nav aria-label="Fichiers OSVALD"><a href="../../propositions/2026-10-20-octopath-traveler/images/12-osvald-01.png">Illustration</a><a href="cards/osvald/card.psd">PSD natif</a></nav></figcaption></figure><figure id="throne"><a class="card" href="cards/throne/card.png" aria-label="THRONÉ : LA RUE D&#39;APRÈS"><img src="cards/throne/card.png" width="897" height="1497" alt="THRONÉ, LA RUE D&#39;APRÈS, VOLEUSE, positions 2 et 3"></a><figcaption><h3>THRONÉ</h3><p class="title">LA RUE D&#39;APRÈS</p><p class="identity">NECRO · Dague · P2 / P3</p><p>Assassine d&#39;ombre : une seule Mort D4 et esquive D5, compensées par DEF basse et absence de soutien. Pas de tour supplémentaire.</p><nav aria-label="Fichiers THRONÉ"><a href="../../propositions/2026-10-20-octopath-traveler/images/13-throne-01.png">Illustration</a><a href="cards/throne/card.psd">PSD natif</a></nav></figcaption></figure><figure id="temenos"><a class="card" href="cards/temenos/card.png" aria-label="TEMENOS : LE DOUTE VEILLE"><img src="cards/temenos/card.png" width="897" height="1497" alt="TEMENOS, LE DOUTE VEILLE, PRÊTRE, positions 4 et 5"></a><figcaption><h3>TEMENOS</h3><p class="title">LE DOUTE VEILLE</p><p class="identity">LUXO · Sceptre · P4 / P5</p><p>Prêtre enquêteur : coeur D3, potion D1, deux faces lumineuses et relance DEF D1. Moins de DEF qu&#39;Ophilia, davantage de risque dans ses soutiens.</p><nav aria-label="Fichiers TEMENOS"><a href="../../propositions/2026-10-20-octopath-traveler/images/14-temenos-02.png">Illustration</a><a href="cards/temenos/card.psd">PSD natif</a></nav></figcaption></figure><figure id="ochette"><a class="card" href="cards/ochette/card.png" aria-label="OCHETTE : LE VENT DES ÎLES"><img src="cards/ochette/card.png" width="897" height="1497" alt="OCHETTE, LE VENT DES ÎLES, CHASSERESSE, positions 2 et 4"></a><figcaption><h3>OCHETTE</h3><p class="title">LE VENT DES ÎLES</p><p class="identity">ELECTRO · Arc · P2 / P4</p><p>Correspondance Kalistar Felineus pour la chasseuse hybride. DPS physique mobile, puissance D3 et esquive D3 ; un éclair, pas d&#39;invocation.</p><nav aria-label="Fichiers OCHETTE"><a href="../../propositions/2026-10-20-octopath-traveler/images/15-ochette-02.png">Illustration</a><a href="cards/ochette/card.psd">PSD natif</a></nav></figcaption></figure><figure id="castti"><a class="card" href="cards/castti/card.png" aria-label="CASTTI : LES GESTES SE SOUVIENNENT"><img src="cards/castti/card.png" width="897" height="1497" alt="CASTTI, LES GESTES SE SOUVIENNENT, APOTHICAIRE, positions 1 et 5"></a><figcaption><h3>CASTTI</h3><p class="title">LES GESTES SE SOUVIENNENT</p><p class="identity">HERBO · Hache · P1 / P5</p><p>Apothicaire Herbo défensive : coeur D5, Garde D3, potion D2. Trois ATK numériques seulement, aucune esquive ; mémoire de soignante, pas de guérison illimitée.</p><nav aria-label="Fichiers CASTTI"><a href="../../propositions/2026-10-20-octopath-traveler/images/16-castti-01.png">Illustration</a><a href="cards/castti/card.psd">PSD natif</a></nav></figcaption></figure></div></section></main>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalistar x Chrono Trigger</title>
<style>
@font-face{font-family:Cinzel;src:url('../../site/assets/fonts/cinzel-v26-latin.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:#101918;color:#e8e9e2;font:16px/1.55 Georgia,serif;letter-spacing:0}
header{padding:28px;border-bottom:1px solid #5d6b65;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:500 26px/1.3 Cinzel,serif;margin:0;color:#ead6b4}
header p{margin:0;color:#b0c3ba;font-size:14px}
main{max-width:2000px;margin:auto;padding:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 24px}
figure{margin:0;min-width:0}
figure a{display:block;aspect-ratio:897/1497;background:#0b100f}
img{width:100%;height:100%;object-fit:contain;display:block}
figcaption{padding-top:12px;border-top:1px solid #465c56;margin-top:12px}
h2{font:500 19px/1.4 Cinzel,serif;margin:0;color:#f0dbb7}
figcaption p{margin:4px 0 0;color:#b3c6bd;font-size:15px}
a:focus-visible{outline:2px solid #d2b781;outline-offset:4px}
footer{padding:24px 28px;border-top:1px solid #465c56;color:#a8bab3;font-size:13px}
footer a{color:#cfba95}a{overflow-wrap:anywhere}
@media(min-width:1900px){main{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){header{padding:20px 16px;gap:8px}h1{font-size:23px}main{grid-template-columns:1fr;padding:18px 12px;gap:30px}footer{padding:20px 16px}}
</style>
</head>
<body>
<header><h1>Kalistar x Chrono Trigger</h1><p>7 cartes &middot; CHRONOTRIGGER</p></header>
<main>
<figure id="crono"><a href="cards/crono/card.png" target="_blank" rel="noopener" aria-label="CRONO"><img src="cards/crono/card.png" alt="Carte Kalistar CRONO" width="897" height="1497"></a><figcaption><h2>CRONO</h2><p>ELECTRO &middot; P2 &middot; HUMAIN</p><p>Eclair et escrime : deux faces magiques, soutien physique D2, esquive D2. Pas de vitesse ou combo hors moteur.</p></figcaption></figure>
<figure id="marle"><a href="cards/marle/card.png" target="_blank" rel="noopener" aria-label="MARLE"><img src="cards/marle/card.png" alt="Carte Kalistar MARLE" width="897" height="1497"></a><figcaption><h2>MARLE</h2><p>CRYO &middot; P5 &middot; HUMAIN</p><p>Soutien froid : Reraise preventif D3 et trefle D1, ATK modeste. Arc represente l&#39;arbalete dans la matrice existante.</p></figcaption></figure>
<figure id="lucca"><a href="cards/lucca/card.png" target="_blank" rel="noopener" aria-label="LUCCA"><img src="cards/lucca/card.png" alt="Carte Kalistar LUCCA" width="897" height="1497"></a><figcaption><h2>LUCCA</h2><p>PYRO &middot; P4 &middot; HUMAIN</p><p>Ingenierie et feu : trois fortes faces magiques, potion D3 et relance defensive D2 ; defense fragile de P4.</p></figcaption></figure>
<figure id="frog"><a href="cards/frog/card.png" target="_blank" rel="noopener" aria-label="FROG"><img src="cards/frog/card.png" alt="Carte Kalistar FROG" width="897" height="1497"></a><figcaption><h2>FROG</h2><p>HYDRO &middot; P3 &middot; BATRA</p><p>Chevalier polyvalent BATRA : lame et eau, soutien physique D1, esquive D3. Aucune garde de P1 sur un profil principal P3.</p></figcaption></figure>
<figure id="robo"><a href="cards/robo/card.png" target="_blank" rel="noopener" aria-label="ROBO"><img src="cards/robo/card.png" alt="Carte Kalistar ROBO" width="897" height="1497"></a><figcaption><h2>ROBO</h2><p>LUXO &middot; P1 &middot; ROBOT</p><p>Protecteur : garde D3, DEF stable et ATK moderee. LUXO est une adaptation Kalistar de sa bienveillance, pas une affirmation de magie canonique.</p></figcaption></figure>
<figure id="ayla"><a href="cards/ayla/card.png" target="_blank" rel="noopener" aria-label="AYLA"><img src="cards/ayla/card.png" alt="Carte Kalistar AYLA" width="897" height="1497"></a><figcaption><h2>AYLA</h2><p>GEO &middot; P2 &middot; HUMAIN</p><p>Force physique et agilite : soutien physique D3 et esquive D5 contre une grosse face DEF perdue. GEO est l&#39;adaptation Kalistel, sans lui inventer de sort canonique.</p></figcaption></figure>
<figure id="magus"><a href="cards/magus/card.png" target="_blank" rel="noopener" aria-label="MAGUS"><img src="cards/magus/card.png" alt="Carte Kalistar MAGUS" width="897" height="1497"></a><figcaption><h2>MAGUS</h2><p>NECRO &middot; P4 &middot; HUMAIN</p><p>Mage offensif : quatre faces magiques, Mort D2, aucun soutien, aucune esquive. Janus reste HUMAIN ; son apparence ne cree pas de race.</p></figcaption></figure>
</main>
<footer><a href="set.json">Profils et choix de jeu</a> &middot; <a href="asset-provenance.json">Sources et prompts</a></footer>
</body>
</html>

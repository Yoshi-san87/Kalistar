<!doctype html>
<html lang="fr" data-hosting="static">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112525">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https://fkskjhlaaagqlfcsojjp.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Kalistar Astraball</title>
  <link rel="icon" type="image/webp" href="/jeu/assets/navigation/kalistel-rainbow-v2.webp">
  <link rel="stylesheet" href="./style.css">
  <script defer src="/jeu/assets/lucide.min.js"></script>
  <script defer src="/jeu/cloud-config.js"></script>
  <script defer src="/jeu/cloud-session.js"></script>
  <script defer src="/jeu/auth-guard.js"></script>
</head>
<body>
  <main id="game" aria-label="Kalistar Astraball">
    <header class="masthead">
      <a class="brand" href="/jeu/#home" title="Retour à Kalistar"><img src="/jeu/assets/logo-rainbow-v2.webp" alt="Kalistar"><span>Astraball</span></a>
      <div class="scoreboard" aria-label="Score"><div class="team team-0"><span>Chroma</span><strong id="score-0">0</strong></div><div class="score-center"><span id="round-label">MANCHE 01</span><img src="/jeu/assets/navigation/kalistel-rainbow-v2.webp" alt=""><small>6 POINTS</small></div><div class="team team-1"><strong id="score-1">0</strong><span>Obsidienne</span></div></div>
      <div class="header-tools"><button class="icon" id="help" title="Règles d’Astraball" aria-label="Règles d’Astraball"><i data-lucide="book-open"></i></button><button class="icon" id="settings" title="Options du match" aria-label="Options du match"><i data-lucide="settings-2"></i></button><button class="icon" id="fullscreen" title="Plein écran" aria-label="Plein écran"><i data-lucide="maximize"></i></button></div>
    </header>
    <section class="initiative-strip" aria-label="Ordre d’initiative"><div class="initiative-title"><i data-lucide="activity"></i><span>INITIATIVE</span></div><div id="initiative"></div></section>
    <div class="match-layout">
      <section class="arena" aria-label="Terrain d’Astraball">
        <div id="canvas-host"></div>
        <div class="venue"><span>LES HAUTS D’ASTRALIA</span><small>Cour des résonances</small></div>
        <div class="view-tools"><button class="icon" id="zoom-out" title="Dézoomer" aria-label="Dézoomer"><i data-lucide="minus"></i></button><button class="icon" id="zoom-reset" title="Recentrer le terrain" aria-label="Recentrer le terrain"><i data-lucide="scan"></i></button><button class="icon" id="zoom-in" title="Zoomer" aria-label="Zoomer"><i data-lucide="plus"></i></button></div>
        <div class="event-ribbon" id="event-ribbon" role="status" aria-live="polite">Entrée des équipes</div>
        <div id="celebration" aria-live="polite" hidden><span id="goal-caption"></span><strong id="goal-title">U !</strong><small id="goal-detail"></small></div>
        <div class="boot" id="boot"><img src="/jeu/assets/navigation/kalistel-rainbow-v2.webp" alt=""><span>La cour s’éveille</span></div>
      </section>
      <aside class="tactics" aria-label="Commandes du joueur">
        <div class="turn-heading"><span id="turn-label">À VOUS DE JOUER</span><span class="turn-dot"></span></div>
        <div id="player-summary"></div>
        <div id="stats" class="stats"></div>
        <div class="phase-track"><span id="phase-move"><b>01</b> Déplacement</span><i data-lucide="chevron-right"></i><span id="phase-action"><b>02</b> Action</span></div>
        <div id="actions" class="actions" role="group" aria-label="Actions"><button data-mode="move"><i data-lucide="footprints"></i><span>Déplacer</span></button><button data-mode="pass"><i data-lucide="arrow-up-right"></i><span>Passer</span></button><button data-mode="shoot"><i data-lucide="crosshair"></i><span>Viser le U</span></button><button data-mode="charge"><i data-lucide="swords"></i><span>Charger</span></button></div>
        <div id="target-panel" class="target-panel"><span id="target-description">Sélectionne une case</span><div id="target-options"></div><button id="confirm-action" class="primary" hidden></button></div>
        <button id="wait" class="end-turn"><span>Terminer l’activation</span><i data-lucide="arrow-right"></i></button>
        <div class="match-journal"><h2><i data-lucide="scroll-text"></i> Fil du match <button class="icon" id="journal" title="Historique complet" aria-label="Historique complet"><i data-lucide="expand"></i></button></h2><ol id="recent-events"></ol></div>
      </aside>
    </div>
    <footer class="statusbar"><span><b class="connection-dot"></b> <span id="mode-label">Exhibition · Solo</span></span><span id="save-status">Sauvegarde locale</span><span>Astraball <b>4.7.1</b></span></footer>
  </main>
  <dialog id="modal"><div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon" id="close-dialog" aria-label="Fermer" title="Fermer"><i data-lucide="x"></i></button></div><div id="dialog-content"></div></dialog>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>

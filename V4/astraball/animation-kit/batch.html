<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalistar - Sprites V2</title><link rel="stylesheet" href="batch.css"><script defer src="icons.js"></script><script type="module" src="batch.mjs"></script></head>
<body>
<header><h1>Kalistar <span>Sprites V2</span></h1><select id="catalog-select" aria-label="Catalogue"><option value="pilot">Dix pilotes</option><option value="all">Tous les personnages</option></select><span id="count"></span><a href="studio.html" title="Gabarit" aria-label="Gabarit"><i data-lucide="grid-2x2"></i></a></header>
<nav aria-label="Animations"><button id="play" title="Lire" aria-label="Lire"><i data-lucide="play"></i></button><label>Animation<select id="clip"></select></label><label>Vitesse<select id="speed"><option value="1">1x</option><option value=".5">0,5x</option><option value=".25">0,25x</option></select></label><button id="mirror" title="Miroir" aria-label="Miroir" aria-pressed="false"><i data-lucide="flip-horizontal-2"></i></button><label class="toggle"><input id="guides" type="checkbox" checked>Repères</label><span id="duration"></span></nav>
<section class="catalog-controls" aria-label="Personnages"><input id="search" type="search" placeholder="Personnage" aria-label="Rechercher un personnage"><select id="faction" aria-label="Faction"><option value="">Toutes les factions</option></select><span id="page-status" aria-live="polite"></span><button id="page-previous" title="Page précédente" aria-label="Page précédente"><i data-lucide="chevron-left"></i></button><button id="page-next" title="Page suivante" aria-label="Page suivante"><i data-lucide="chevron-right"></i></button></section>
<main id="grid" aria-busy="true"></main><p id="empty" hidden>Aucun personnage disponible pour cette sélection.</p><p id="error" role="alert"></p>
<dialog id="detail"><header><h2 id="detail-name"></h2><button id="close" title="Fermer" aria-label="Fermer"><i data-lucide="x"></i></button></header><div class="detail-controls"><button id="detail-play" title="Lire" aria-label="Lire"><i data-lucide="play"></i></button><select id="detail-clip" aria-label="Animation du personnage"></select><select id="detail-zoom" aria-label="Zoom"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select></div><div class="detail-stage"><canvas id="detail-canvas" width="640" height="640"></canvas></div><div class="transport"><button id="previous" title="Frame précédente" aria-label="Frame précédente"><i data-lucide="skip-back"></i></button><input id="frame" type="range" min="0" max="3" value="0" aria-label="Frame"><button id="next" title="Frame suivante" aria-label="Frame suivante"><i data-lucide="skip-forward"></i></button><output id="counter"></output></div><div id="downloads"></div></dialog>
<footer><span>Échelle native commune · 64 px / m</span><span>14 animations · 64 frames par personnage</span><span>Lot en revue · non intégré au jeu</span></footer>
</body></html>

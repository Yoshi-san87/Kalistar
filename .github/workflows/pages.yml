name: Publish Kalistar
on:
  push:
    branches: [main]
    paths: ['V4/**', 'V3/donnees/**', 'V3/site/assets/**', 'V3/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalistar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fetch only playable media
        run: git lfs pull --include="$(node V4/deploy/build.cjs --lfs-paths)" --exclude=""
      - name: Fetch native medallion verification sources
        run: git lfs pull --include="V4/atelier/designer-assets/frame/default.png,V4/atelier/designer-assets/packed/banks/weapon-Hache.png,V4/atelier/designer-assets/packed/banks/weapon-Instrument.png,V4/atelier/designer-assets/packed/banks/return-weapon-4.png" --exclude=""
      - name: Check catalogue and mechanics
        run: |
          node --test V4/atelier/game-catalog.test.cjs V4/atelier/collaboration-arenas.test.cjs V4/deploy/build.test.cjs V4/deploy/pwa.test.cjs V4/site/statistics.test.cjs V4/site/collaborations.test.cjs V4/site/metal-gear.test.cjs V4/site/resident-evil.test.cjs V4/site/one-piece.test.cjs
          node --test V4/expansions/2026-10-01-one-piece/model.test.cjs
          node --test V4/revisions/2026-10-04-armor-refinement/integration.test.cjs
          node --test V4/revisions/2026-10-05-orven-long-spear/revision.test.cjs
          node --test V4/revisions/2026-10-01-stat-personality/revision.test.cjs
          node --test V4/expansions/2026-10-01-rikka-rooftops/model.test.cjs
          node --test V4/expansions/2026-10-01-one-piece-witcher/model.test.cjs
          node --test V4/revisions/2026-10-01-luffy-light/revision.test.cjs
          node --test V4/expansions/2026-10-02-witcher-completion/model.test.cjs V4/revisions/2026-10-02-sanji-legs/revision.test.cjs
          node --test V4/releases/2026-10-02-pages-portability/portable.test.cjs
          node V4/site/kalistel.test.cjs
          node V4/site/arena-ambience.test.cjs
          node --test V4/site/equipment.test.cjs V4/site/equipment-presentation.test.cjs
          node --test V4/site/arborium-weapons.test.cjs
          node --test V4/site/draevenheim-weapons.test.cjs
          node --test V4/site/weapon-art.test.cjs
          node --test V4/site/base-weapons.test.cjs
          node --test V4/site/team-composition.test.cjs
          node --test V4/site/lineup-intro.test.cjs V4/site/turn-order.test.cjs
          node --test V4/site/turn-timeline.test.cjs
          node --test V4/site/catalogue-updates.test.cjs
          node --test V4/site/match-metrics.test.cjs V4/site/kill-medals.test.cjs
          node --test V4/site/navigation.test.cjs
          node --test V4/site/ui-system.test.cjs
          node --test V4/site/story-content.test.cjs
      - name: Build playable release
        run: node V4/deploy/build.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: V4/deploy/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
